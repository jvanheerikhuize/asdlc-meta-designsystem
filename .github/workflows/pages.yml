name: pages

# Builds the primary Design System Showcase at / (and /showcase/) and bolts the Spec-Blueprint dashboard onto /specs/.
# Only main may deploy. A new tag is published by the next main deploy, or by running this workflow on main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Fetch Spec-Blueprint, validate .specs/records, and assemble Pages
        run: |
          VER=$(grep -i '^Spec-Blueprint:' TECH_STACK.md | sed -E 's/.*asdlc-meta-specs@([A-Za-z0-9._-]+).*/\1/' || true)
          VER=${VER:-latest}
          BASE_URL="https://jvanheerikhuize.github.io/asdlc-meta-specs/${VER}"
          curl -fsSL "${BASE_URL}/tools/spec.py" -o /tmp/spec.py
          python3 /tmp/spec.py --root . check --strict --verify tests
          python3 -m unittest discover -s tests -v

          bash scripts/build-site.sh /tmp/spec.py "$BASE_URL"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
